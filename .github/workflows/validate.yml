name: validate-order-system
permissions:
  contents: read

on:
  push:
    branches:
      - feature/daily-hotel-reports
      - main
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install sender dependencies
        working-directory: sender
        run: npm install --no-audit --no-fund
      - name: Check sender syntax
        working-directory: sender
        run: node --check send.js && node --check workbooks.js
      - name: Run workbook tests
        working-directory: sender
        run: npm test
      - name: Check warehouse, reporting and audit scripts
        run: node --check inventory.js && node --check monthly-cost.js && node --check analytics.js && node --check audit.js
      - name: Ensure purchasing UI is absent
        run: |
          ! grep -q 'data-t="p"' dashboard.html
          ! grep -q 'procurement.js' dashboard.html
          ! grep -q 'receive_hotel_purchase_order' dashboard.html inventory.js
      - name: Check dashboard JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('dashboard.html', 'utf8');
          const start = html.lastIndexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('Inline dashboard script not found');
          new Function(html.slice(start + 8, end));
          console.log('Dashboard JavaScript syntax OK');
          NODE
      - name: Check worker portal JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.lastIndexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('Worker inline script not found');
          new Function(html.slice(start + 8, end));
          console.log('Worker portal JavaScript syntax OK');
          NODE
      - name: Check monitoring module JavaScript syntax
        run: node --check monitor.js
      - name: Check backup module JavaScript syntax
        run: node --check backup.js
      - name: Check analytics insight regression guards
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const analytics = fs.readFileSync('analytics.js', 'utf8');
          assert.ok(analytics.includes('الفترة السابقة للمقارنة'));
          assert.ok(analytics.includes('150% من المتوسط'));
          assert.ok(analytics.includes('سعر تقديري'));
          assert.ok(analytics.includes('نفس الفندق والقسم'));
          console.log('Analytics insight regression guards OK');
          NODE
      - name: Check backup export security and validation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const edge = fs.readFileSync('supabase/functions/sbfenv/index.ts', 'utf8');
          const dashboard = fs.readFileSync('dashboard.html', 'utf8');
          const backup = fs.readFileSync('backup.js', 'utf8');
          const gate = edge.indexOf('if (user.id !== OWNER');
          const action = edge.indexOf('if (action === "backup_export")');
          assert.ok(gate >= 0 && action > gate, 'Backup export must be behind the owner gate');
          assert.ok(edge.includes('const backupTables = ['));
          assert.ok(edge.includes('hotels", columns: "code,name,expires_at,active,created_at"'), 'Hotel access keys must not be exported');
          assert.ok(edge.includes('totalLimit = 12000') && edge.includes('tableLimit = 5000'));
          assert.ok(edge.includes('Backup limit reached') && edge.includes('Backup is too large'));
          for (const forbidden of ['app_secrets','app_users','auth.users','license','hotels.key']) {
            assert.ok(edge.includes(forbidden), 'Expected explicit backup exclusion: ' + forbidden);
          }
          assert.ok(dashboard.includes('data-t="b"') && dashboard.includes('id="b"') && dashboard.includes('backup.js'));
          assert.ok(dashboard.includes("currentAuthUid()!=='c7562642-7c60-461b-ac8c-dddcee41d22b'"), 'Backup tab must be owner-only in the UI');
          assert.ok(backup.includes('JSON.stringify(data.includes)!==JSON.stringify(EXPECTED)'));
          assert.ok(backup.includes("crypto.subtle.digest('SHA-256'") && backup.includes('النسخة سليمة'));
          assert.ok(!/\.from\([^)]*\)\.(insert|update|upsert|delete)\(/.test(backup), 'Backup UI must remain read-only');
          console.log('Backup security and validation guards OK');
          NODE
      - name: Check monitoring endpoint security boundary
        run: |
          grep -q 'if (action === "monitor")' supabase/functions/sbfenv/index.ts
          grep -q 'user.id !== OWNER' supabase/functions/sbfenv/index.ts
          grep -q 'button data-t="m"' dashboard.html
          grep -Fq "ownerAction('monitor')" monitor.js
      - name: Check management dashboard syntax and permission-gated threshold edits
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('admin.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
          const script = scripts.find(s => s.includes('async function api('));
          assert.ok(script, 'Management dashboard application script not found');
          new Function(script);
          const apiStart = script.indexOf('async function api(');
          const apiEnd = script.indexOf('\n}', apiStart);
          const restApi = apiStart >= 0 && apiEnd > apiStart ? script.slice(apiStart, apiEnd) : '';
          assert.ok(restApi && !/method\s*:/.test(restApi), 'General Supabase API helper must remain GET-only');
          assert.ok(script.includes('if(!canEditThresholds)return alert('), 'Threshold edits must be permission-gated');
          assert.ok(script.includes("method:'PATCH'"), 'Threshold update path must remain explicit');
          console.log('Management dashboard syntax and threshold permission guards OK');
          NODE
      - name: Check security hardening regressions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const assert = require('node:assert/strict');
          const dashboard = fs.readFileSync('dashboard.html', 'utf8');
          const worker = fs.readFileSync('index.html', 'utf8');
          const admin = fs.readFileSync('admin.html', 'utf8');
          const edge = fs.readFileSync('supabase/functions/sbfenv/index.ts', 'utf8');
          const workerEdge = fs.readFileSync('supabase/functions/hotel-portal/index.ts', 'utf8');
          const migrations = fs.readdirSync('supabase/migrations').map(f => fs.readFileSync('supabase/migrations/' + f, 'utf8')).join('\n');

          assert.ok(!dashboard.includes('GHTOK'));
          assert.ok(!dashboard.includes('api.github.com/repos/githup29333/store-system/actions/workflows/send.yml/dispatches'));
          assert.ok(dashboard.includes("ownerAction('dispatch_status')"));
          assert.ok(dashboard.includes("ownerAction('set_dispatch_token'"));
          assert.ok(worker.includes('const escHtml='));
          assert.ok(worker.includes('escHtml(x.c.n)'));
          assert.ok(worker.includes('escHtml(c.n)'));
          assert.ok(worker.includes('escHtml(x.n.n)'));
          assert.ok(worker.includes('history.replaceState'));
          assert.ok(worker.includes('rq<=0||is<0||is>rq'));
          assert.ok(worker.includes('iss>req'));
          assert.ok(worker.includes('/functions/v1/hotel-portal'));
          assert.ok(!worker.includes('/rest/v1/rpc/'));
          assert.ok(worker.includes('1 MB'));
          assert.ok(edge.includes('if (action === "set_dispatch_token")'));
          assert.ok(edge.includes('if (action === "delete_dispatch_token")'));
          assert.ok(edge.includes('user.id !== OWNER'));
          assert.ok(workerEdge.includes('hotel_info') && workerEdge.includes('hotel_log'));
          assert.ok(workerEdge.includes('^[A-Za-z0-9_-]{32}$'));
          assert.ok(migrations.includes('REVOKE ALL ON ALL TABLES IN SCHEMA public FROM anon, PUBLIC'));
          assert.ok(migrations.includes('allowed_mime_types'));
          assert.ok(migrations.includes("key <> 'gh_dispatch'"));
          assert.ok(migrations.includes('GRANT EXECUTE ON FUNCTION public.hotel_log(text, text, text, text, text, text) TO service_role'));
          assert.ok(!/(service_role|sb_secret_)/i.test(dashboard + worker + admin));
          assert.ok(edge.includes('authHeader.replace(/^Bearer\\s+/i'));
          assert.ok(edge.includes('/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/'));
          assert.ok(edge.includes('/\\s/.test(githubToken)'));
          const tracked = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).split(/\r?\n/);
          assert.ok(!tracked.some(p => /(^|\/)\.env$/.test(p)), 'A real .env file must never be committed');
          console.log('Security regression guards OK');
          NODE
      - name: Check per-order and missing-price safeguards
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const dashboard = fs.readFileSync('dashboard.html', 'utf8');
          const sender = fs.readFileSync('sender/send.js', 'utf8');
          const assert = require('node:assert/strict');
          assert.ok(dashboard.includes('return {lines,total,missing,priced,byCat'));
          assert.ok(dashboard.includes('بانتظار السعر'));
          assert.ok(dashboard.includes('ملخص الإدارة') && dashboard.includes('تفاصيل الأصناف'));
          assert.ok(dashboard.includes('cost_path:costPath'));
          assert.ok(sender.includes("'Issue_'+d.dept+'_'+d.no+'.xlsx'"));
          assert.ok(sender.includes("'Cost_'+d.dept+'_'+d.no+'.xlsx'"));
          assert.ok(sender.includes('if(!d.file_path||!d.cost_path)'));
          assert.ok(sender.includes("r.hotel===h"));
          assert.ok(sender.includes("status=eq.pending"));
          assert.ok(sender.includes("Africa/Tripoli"));
          assert.ok(sender.includes('approved manual orders will still be processed'));
          assert.ok(sender.includes('dept=neq.ALL'));
          assert.ok(sender.includes('verify mailbox before retry'));

          assert.ok(!dashboard.includes('Dept Yesterday') && !dashboard.includes('Diff vs Yesterday'));
          console.log('Order isolation and missing-price safeguards OK');
          NODE
