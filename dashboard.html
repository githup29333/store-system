<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf0;--card:#fff;--ink:#16222c;--mut:#5d6b78;--ac:#0b5c7a;--ok:#1d7a4f;--warn:#b4531a;--bad:#b4231a;--ln:#cfd7de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Tajawal,Tahoma,Arial,sans-serif}
header{background:var(--ac);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:19px;flex:1}
nav{display:flex;gap:6px;padding:10px 12px 0;max-width:1000px;margin:auto;overflow-x:auto}
nav button{flex:1;white-space:nowrap;padding:9px 12px;border:0;border-radius:8px 8px 0 0;background:#d3dbe1;font:inherit;font-weight:700;color:var(--mut)}
nav button.on{background:var(--card);color:var(--ac)}
main{max-width:1000px;margin:auto;background:var(--card);padding:14px;min-height:70vh}
input,button,select{font:inherit}
input[type=text],input[type=email],input[type=password],input[type=search],select{padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--ink)}
.btn{padding:7px 12px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
.btn.alt{background:#fff;color:var(--ac);border:1px solid var(--ac)}
.btn.bad{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#f3f6f8;border-radius:10px;padding:12px;text-align:center}
.kpi b{display:block;font-size:26px;color:var(--ac)}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--ln);padding:6px 8px;text-align:right;vertical-align:middle}
th{background:#eef2f5}
.wrap{overflow-x:auto}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}
.bar span{min-width:130px;font-size:13px}
.bar i{display:block;height:14px;background:var(--ac);border-radius:4px}
.bar em{font-style:normal;font-size:13px;color:var(--mut)}
h3{margin:18px 0 6px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}
.t-bad{background:#fbe3e0;color:var(--bad)}.t-ok{background:#dff3e8;color:var(--ok)}.t-w{background:#fff0dc;color:var(--warn)}
#login{max-width:340px;margin:60px auto;background:#fff;padding:22px;border-radius:12px}
#login input{width:100%;margin-bottom:10px}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px}
#modal>div{background:#fff;border-radius:12px;padding:16px;max-width:640px;width:100%;max-height:85vh;overflow:auto}
[hidden]{display:none!important}
#msg{color:var(--bad);min-height:1.5em}
</style>
</head>
<body>
<div id="login">
 <h2 style="margin-top:0">لوحة التحكم</h2>
 <input type="email" id="em" placeholder="البريد الإلكتروني" autocomplete="username">
 <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password">
 <button class="btn" id="go" style="width:100%">دخول</button>
 <p id="msg"></p>
</div>
<div id="app" hidden>
 <header><h1>لوحة التحكم — منظومة الصرف</h1><select id="hf" style="padding:5px;border-radius:8px"></select><button class="btn alt" id="rf">تحديث</button><button class="btn alt" id="lo">خروج</button></header>
 <nav><button data-t="s" class="on">الملخص</button><button data-t="o">الطلبات</button><button data-t="i">الأصناف</button><button data-t="l">الروابط</button><button data-t="d">الإرسال</button><button data-t="c">التكاليف</button><button data-t="v">المخزون</button><button data-t="k">الفنادق والصلاحية</button></nav>
 <main>
  <section id="s"></section>
  <section id="o" hidden></section>
  <section id="i" hidden></section>
  <section id="l" hidden></section>
  <section id="d" hidden></section>
  <section id="c" hidden></section>
  <section id="v" hidden></section>
  <section id="k" hidden></section>
 </main>
 <footer style="text-align:center;color:#5d6b78;font-size:12px;padding:12px" id="credit"></footer>
</div>
<div id="modal" hidden><div id="mb"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
 <script src="inventory.js"></script>
<script>
const $=s=>document.querySelector(s);
const SB='https://xthhojjcblknukwgksxw.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0aGhvampjYmxrbnVrd2drc3h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MzA3NTEsImV4cCI6MjEwMDEwNjc1MX0.CDE76L1A6szBp9kYlZD3O1FtBl4CFuAseaRlEjk_Z98';
let S=null,NM={},BASE=[],SH={},O=[],ITEMS=[],LICROW=null,DEL=[],REC=[],DELERR=false,GHTOK=null,AUTOCFG={enabled:false,time:'15:00',timezone:'Africa/Tripoli',enabled_at:null},HOTELS=[],HSEL='',PRICES=[],LINKS=[],CTAB='match',INVENTORY=[],MOVEMENTS=[],INVERR='';
const XL='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const CREDIT='© 2026 Theo — جميع الحقوق محفوظة / All rights reserved';
const DSEL=new Set(),enc=encodeURIComponent;
const OV=()=>HSEL?O.filter(o=>o.hotel===HSEL):O,DV=()=>HSEL?DEL.filter(d=>d.hotel===HSEL):DEL,RV=()=>HSEL?REC.filter(r=>r.hotel===HSEL):REC;
const fmtD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
try{S=JSON.parse(sessionStorage.getItem('s')||'null')}catch(e){}
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=ds=>'20'+ds.slice(0,2)+'-'+ds.slice(2,4)+'-'+ds.slice(4);
const ERR={'Invalid login credentials':'البريد أو كلمة المرور غير صحيحة','Email not confirmed':'البريد غير مفعّل — فعّله من Supabase (Authentication ثم Users)','Email logins are disabled':'تسجيل الدخول بالبريد معطّل في إعدادات Supabase'};
async function auth(body,gt){
 let r;
 try{r=await fetch(SB+'/auth/v1/token?grant_type='+gt,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})}
 catch(e){throw new Error('تعذّر الاتصال بالخادم، قد تكون الشبكة تحجب Supabase ('+e.message+')')}
 if(!r.ok){let j={};try{j=await r.json()}catch(e){}const m=j.error_description||j.msg||j.message||('HTTP '+r.status);throw new Error(ERR[m]||m)}
 const j=await r.json();S={a:j.access_token,r:j.refresh_token};
 try{sessionStorage.setItem('s',JSON.stringify(S))}catch(e){}
}
async function api(path,opt={},retry=true){
 const r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+(S&&S.a),'Content-Type':'application/json',...(opt.headers||{})}});
 if(r.status===401&&retry&&S&&S.r){try{await auth({refresh_token:S.r},'refresh_token');return api(path,opt,false)}catch(e){logout('انتهت الجلسة، سجّل الدخول من جديد');throw e}}
 if(!r.ok)throw new Error(await r.text());
 const tx=await r.text();return tx?JSON.parse(tx):null;
}
function logout(m){S=null;try{sessionStorage.removeItem('s')}catch(e){}$('#app').hidden=true;$('#login').hidden=false;$('#msg').textContent=m||''}
$('#go').onclick=async()=>{
 const b=$('#go');$('#msg').textContent='';b.disabled=true;b.textContent='جاري الدخول…';
 try{await auth({email:$('#em').value.trim(),password:$('#pw').value},'password');$('#pw').value='';await start()}
 catch(e){$('#msg').textContent=e.message||'فشل الدخول'}
 finally{b.disabled=false;b.textContent='دخول'}
};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#lo').onclick=()=>logout();$('#rf').onclick=()=>load();
document.querySelector('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
 document.querySelectorAll('nav button').forEach(b=>b.className=b.dataset.t===t?'on':'');
 ['s','o','i','l','d','c','v','k'].forEach(i=>$('#'+i).hidden=i!==t)};

function parse(r){
 const f=r.code.split('|'),fin=f[0]==='EBR1F';
 const it=(f[6]||'').split(',').filter(Boolean).map(x=>{const a=x.split(':');return fin?{id:+a[0],req:+a[1],iss:+a[2]}:{id:+a[0],req:+a[1]}});
 ((fin?f[9]:f[8])||'').split(';').filter(Boolean).forEach(t=>{const [id,n,u]=t.split('~');NM[id]={n,u:u||''}});
 return{fin,dept:f[1],no:f[2],ds:f[3],dn:f[7]||f[1],wk:fin?f[8]:'',it,at:r.created_at,dev:r.device};
}
function build(rows){
 const m={};
 rows.slice().sort((a,b)=>a.created_at<b.created_at?-1:1).forEach(r=>{
  const p=parse(r),k=(r.hotel||'')+'|'+p.dept+'|'+p.no+'|'+p.ds;
  const o=m[k]||(m[k]={k,hotel:r.hotel||'',dept:p.dept,no:p.no,ds:p.ds,dn:p.dn,req:{},fin:null,at:p.at,dev:p.dev});
  o.at=p.at;
  if(p.fin)o.fin={it:p.it,wk:p.wk||p.dev};else{p.it.forEach(x=>o.req[x.id]=x.req);o.dev=p.dev}
 });
 return Object.values(m).sort((a,b)=>a.at<b.at?1:-1);
}
const nm=id=>NM[id]||SH[id]||(BASE[id-1]?{n:BASE[id-1][0],u:BASE[id-1][1]||''}:{n:'صنف #'+id,u:''});
const lines=o=>o.fin?o.fin.it:Object.keys(o.req).map(id=>({id:+id,req:o.req[id]}));

async function load(){
 try{
  const [orders,items]=await Promise.all([api('orders?select=*&order=created_at.desc&limit=3000'),api('items?select=*&order=id.asc&limit=2000')]);
  ITEMS=items;SH={};items.forEach(x=>SH[x.id]={n:x.ar,u:x.en});
  O=build(orders);
  HOTELS=await api('hotels?select=*&order=created_at.asc').catch(()=>[]);
  fillHF();
  try{[PRICES,LINKS]=await Promise.all([api('prices?select=*&order=id.asc&limit=2000'),api('item_price_link?select=*&limit=2000')])}catch(e){PRICES=[];LINKS=[]}
  GHTOK=await api('app_secrets?select=value&key=eq.gh_dispatch').then(r=>r[0]&&r[0].value||null).catch(()=>null);
  AUTOCFG=await api('app_secrets?select=value&key=eq.auto_send_config').then(r=>{try{return r[0]?JSON.parse(r[0].value):AUTOCFG}catch(e){return AUTOCFG}}).catch(()=>AUTOCFG);
  DELERR=false;try{[DEL,REC]=await Promise.all([api('deliveries?select=*&order=updated_at.desc&limit=500'),api('recipients?select=*&order=id.asc')])}catch(e){DEL=[];REC=[];DELERR=true}
 }catch(e){$('#s').innerHTML='<p style="color:#b4231a">تعذّر تحميل البيانات: '+esc(e.message)+'</p>'}
 try{[INVENTORY,MOVEMENTS]=await Promise.all([api('hotel_inventory?select=*&limit=5000'),api('hotel_stock_movements?select=*&order=created_at.desc&limit=200')]);INVERR=''}catch(e){INVENTORY=[];MOVEMENTS=[];INVERR=e.message}
 drawS();drawO();drawI();drawL();drawD();drawC();drawV();drawK();
}
async function start(){
 $('#login').hidden=true;$('#app').hidden=false;
 try{const t=await (await fetch('index.html')).text();const m=t.match(/const DEF=`([^`]*)`/);if(m)BASE=m[1].split('\n').filter(Boolean).map(l=>l.split('|'))}catch(e){}
 load();
}
const bars=(arr,col)=>{const mx=Math.max(1,...arr.map(a=>a[1]));return arr.map(a=>`<div class="bar"><span>${esc(a[0])}</span><i style="width:${Math.round(a[1]*100/mx)}%;max-width:60%;min-width:3px${col?';background:'+col:''}"></i><em>${a[1]}</em></div>`).join('')||'<p>لا توجد بيانات</p>'};
const topN=(m,n)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);

function drawS(){
 const OO=OV(),DD=DV(),fin=OO.filter(o=>o.fin),pend=OO.length-fin.length;
 const unsent=DD.filter(x=>['pending','approved','sending','failed'].includes(x.status)).length,stale=OO.filter(o=>!o.fin&&(Date.now()-new Date(o.at))>864e5).length;
 let rq=0,dv=0;const na={},rqd={},issued={},dep={},day={};
 OO.forEach(o=>{dep[o.dn]=(dep[o.dn]||0)+1;day[o.ds]=(day[o.ds]||0)+1;lines(o).forEach(x=>{rqd[x.id]=(rqd[x.id]||0)+1})});
 fin.forEach(o=>o.fin.it.forEach(x=>{rq+=x.req;dv+=Math.min(x.req,Math.max(0,x.iss));if(x.iss<=0)na[x.id]=(na[x.id]||0)+1;if(x.iss>0)issued[x.id]=(issued[x.id]||0)+x.iss}));
 const sent=DD.filter(x=>x.status==='sent'&&!x.code.startsWith('BATCH|'));
 const totalCost=sent.reduce((a,d)=>a+orderCost(ordH(d)).total,0);
 const days=Object.keys(day).sort().slice(-14).map(d=>[dt(d).slice(5),day[d]]);
 $('#s').innerHTML=`<div class="grid"><div class="kpi"><b>${OO.length}</b>إجمالي الطلبات</div><div class="kpi"><b>${fin.length}</b>تم الصرف</div><div class="kpi"><b>${pend}</b>بانتظار الصرف</div><div class="kpi"><b>${rq?Math.round(dv*100/rq):0}%</b>نسبة التلبية</div><div class="kpi"><b>${ITEMS.length}</b>أصناف مشتركة</div><div class="kpi"><b style="color:${unsent?'#b4231a':'#1d7a4f'}">${unsent}</b>نتائج لم تُرسل</div><div class="kpi"><b style="color:${stale?'#b4531a':'#1d7a4f'}">${stale}</b>بدون كود نهائي +24س</div></div>
 <h3>الطلبات حسب القسم</h3>${bars(topN(dep,10))}
 <h3>آخر 14 يوم</h3>${bars(days)}
 <h3>الأكثر طلباً</h3>${bars(topN(rqd,10).map(([id,c])=>[nm(id).n,c]))}
 <h3>الأكثر عدم توفراً</h3>${bars(topN(na,10).map(([id,c])=>[nm(id).n,c]),'#b4231a')}`;
}
function drawO(){
 $('#o').innerHTML=`<div class="row"><input type="search" id="oq" placeholder="ابحث برقم الطلب أو القسم" style="flex:1"></div><div class="wrap"><table><tr><th>الفندق</th><th>الرقم</th><th>القسم</th><th>التاريخ</th><th>الحالة</th><th>الأصناف</th><th>الجهاز</th><th></th></tr><tbody id="ob"></tbody></table></div>`;
 const f=()=>{const q=$('#oq').value.trim().toLowerCase();
  $('#ob').innerHTML=OV().filter(o=>!q||(o.no+' '+o.dn).toLowerCase().includes(q)).map(o=>`<tr><td>${esc(o.hotel)}</td><td><b>${esc(o.no)}</b></td><td>${esc(o.dn)}</td><td>${dt(o.ds)}</td><td><span class="tag ${o.fin?'t-ok':'t-w'}">${o.fin?'تم الصرف':'بانتظار الصرف'}</span></td><td>${lines(o).length}</td><td>${esc(o.fin?o.fin.wk:o.dev)}</td><td><button class="btn alt" data-v="${esc(o.k)}">تفاصيل</button> <button class="btn bad" data-d="${esc(o.k)}">حذف</button></td></tr>`).join('')||'<tr><td colspan="8">لا توجد طلبات</td></tr>'};
 $('#oq').oninput=f;f();
}
$('#o').onclick=async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.v){const o=O.find(x=>x.k===b.dataset.v);
  const rows=lines(o).map(x=>{const n=nm(x.id),st=o.fin?(x.iss<=0?'غير متوفر':x.iss<x.req?'جزئي':'تم'):'—';return `<tr><td>${esc(n.n)}<br><small dir="ltr">${esc(n.u)}</small></td><td>${x.req}</td><td>${o.fin?Math.max(0,x.iss):'—'}</td><td>${st}</td></tr>`}).join('');
  $('#mb').innerHTML=`<h3 style="margin-top:0">طلب ${esc(o.no)} — ${esc(o.dn)} — ${dt(o.ds)}</h3><table><tr><th>الصنف</th><th>المطلوب</th><th>المصروف</th><th>الحالة</th></tr>${rows}</table><p><button class="btn" onclick="$('#modal').hidden=true">إغلاق</button></p>`;$('#modal').hidden=false}
 if(b.dataset.d){const o=O.find(x=>x.k===b.dataset.d);
  if(!confirm('حذف الطلب '+o.no+' من لوحة التحكم؟ (لا يحذف نسخ الأجهزة)'))return;
  try{await api('orders?dept=eq.'+encodeURIComponent(o.dept)+'&no=eq.'+encodeURIComponent(o.no),{method:'DELETE'});load()}catch(err){alert('تعذّر الحذف: '+err.message)}}
};
function drawI(){
 $('#i').innerHTML=`<p>كل الأصناف (الأساسية والمضافة). عمود <b>الفنادق</b>: فارغ = مشترك لكل الفنادق، أو أكواد مفصولة بفاصلة (مثل <span dir="ltr">EBR,H2</span>) ليظهر الصنف لهذه الفنادق فقط.</p><div class="row"><input type="search" id="iq" placeholder="ابحث" style="flex:1"></div><div class="wrap"><table><tr><th>#</th><th>كود Odoo</th><th>عربي</th><th>English</th><th>الفنادق</th><th></th></tr><tbody id="ib"></tbody></table></div>`;
 const f=()=>{const q=$('#iq').value.trim().toLowerCase();
  $('#ib').innerHTML=ITEMS.filter(x=>!q||(x.ar+' '+x.en+' '+(x.code||'')).toLowerCase().includes(q)).map(x=>`<tr><td>${x.id}</td><td dir="ltr">${esc(x.code||'')}</td><td><input type="text" value="${esc(x.ar)}" data-a="${x.id}" style="width:100%"></td><td><input type="text" value="${esc(x.en)}" data-e="${x.id}" style="width:100%;direction:ltr"></td><td><input type="text" value="${esc((x.hotels||[]).join(','))}" data-hh="${x.id}" placeholder="مشترك" style="width:90px;direction:ltr"></td><td><button class="btn" data-s="${x.id}">حفظ</button> <button class="btn bad" data-x="${x.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="6">لا توجد أصناف</td></tr>'};
 $('#iq').oninput=f;f();
}
function HV(id){
 const v=document.querySelector(`[data-hh="${id}"]`).value.split(/[\s,]+/).map(x=>x.trim().toUpperCase()).filter(Boolean),ok=HOTELS.map(h=>h.code);
 const bad=v.filter(x=>!ok.includes(x));if(bad.length)throw new Error('فندق غير موجود: '+bad.join(','));
 return v;
}
$('#i').onclick=async e=>{
 const b=e.target.closest('button');if(!b)return;
 try{
  if(b.dataset.s){const id=b.dataset.s;await api('items?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({ar:document.querySelector(`[data-a="${id}"]`).value.trim(),en:document.querySelector(`[data-e="${id}"]`).value.trim(),hotels:HV(id)})});b.textContent='تم ✓';setTimeout(load,600)}
  if(b.dataset.x){if(!confirm('حذف الصنف نهائياً؟ الأجهزة تختفي منها بعد التحديث.'))return;await api('items?id=eq.'+b.dataset.x,{method:'DELETE'});load()}
 }catch(err){alert('تعذّر التنفيذ: '+err.message)}
};
function drawL(){
 const base=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
 const L=[['رابط المشرف (أنت)',base],['رابط الأقسام (طلب فقط)',base+'?m=order'],['رابط العامل',base+'?m=worker'],['لوحة التحكم',base+'dashboard.html'],['مشروع Supabase','https://supabase.com/dashboard/project/xthhojjcblknukwgksxw'],['مستودع GitHub','https://github.com/githup29333/store-system']];
 $('#l').innerHTML=L.map(([t,u])=>`<div class="row"><b style="min-width:160px">${t}</b><input type="text" readonly value="${esc(u)}" style="flex:1;direction:ltr"><button class="btn alt" data-c="${esc(u)}">نسخ</button><a class="btn" href="${esc(u)}" target="_blank" rel="noopener" style="text-decoration:none">فتح</a></div>`).join('');
}
$('#l').onclick=e=>{const b=e.target.closest('[data-c]');if(b)navigator.clipboard.writeText(b.dataset.c).then(()=>{b.textContent='تم ✓';setTimeout(()=>b.textContent='نسخ',1200)})};

function addSheet(wb,ord,name){
 const ws=wb.addWorksheet(name,{views:[{rightToLeft:true,state:'frozen',ySplit:5}],pageSetup:{paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,printTitlesRow:'5:5',margins:{left:.4,right:.4,top:.5,bottom:.5,header:.3,footer:.3}}});

const UNIT_GROUP={'قطعة':['وحدة','قطعة'],'حزمة':['حزمة'],'صندوق':['صندوق'],'كيلو':['كيلو','كجم','كغ','kg','KG']};

}

  const a0=acc/tot*360;acc+=v;const a1=acc/tot*360,large=(a1-a0)>180?1:0;

 });

 </svg>`;
}

    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);

 }else if(CTAB==='orders'){
  const L=DV().filter(d=>d.status==='sent'&&!d.code.startsWith('BATCH|')).slice(0,60);
  const rows=L.map(d=>{const {total,missing}=orderCost(ordH(d));return `<tr><td>${esc(d.hotel)}</td><td>${esc(d.no)}</td><td>${esc(d.dn)}</td><td>${dt(d.ds)}</td><td>${money(total)}</td><td>${missing?'<span style="color:#b4231a">⚠ '+missing+'</span>':'✓'}</td></tr>`}).join('')||'<tr><td colspan="6">لا توجد طلبات مُرسلة بعد</td></tr>';
  body=`<div class="wrap"><table><tr><th>الفندق</th><th>الطلب</th><th>القسم</th><th>التاريخ</th><th>التكلفة</th><th>التسعير</th></tr>${rows}</table></div><p style="color:var(--mut)">آخر 60 طلب مُرسل. التكلفة بالأسعار الحالية.</p>`;
 }else if(CTAB==='cmp'){
  const L=DV().filter(d=>d.status==='sent'&&!d.code.startsWith('BATCH|'));
  const byDay={};L.forEach(d=>{byDay[d.ds]=(byDay[d.ds]||0)+orderCost(ordH(d)).total});
  const days=Object.keys(byDay).sort((a,b)=>b.localeCompare(a));
  const rows=days.map((ds,i)=>{const cur=byDay[ds],prev=i+1<days.length?byDay[days[i+1]]:null;
   const diff=prev==null?null:cur-prev,pct=prev?Math.round(diff/prev*100):null;
   const arrow=diff==null?'':diff>0?'🔺':diff<0?'🔻':'➖';
   return `<tr><td>${dt(ds)}</td><td>${money(cur)}</td><td>${diff==null?'—':arrow+' '+money(Math.abs(diff))+(pct!=null?' ('+Math.abs(pct)+'%)':'')}</td></tr>`}).join('')||'<tr><td colspan="3">لا توجد بيانات</td></tr>';
  body=`<table><tr><th>اليوم</th><th>إجمالي التكلفة</th><th>الفرق عن اليوم السابق الذي فيه بيانات</th></tr>${rows}</table><p style="color:var(--mut)">المقارنة بأسعار اليوم الحالية وليست بأسعار يوم الصرف الفعلي.</p>`;
 }else if(CTAB==='pie'){
  const L=DV().filter(d=>d.status==='sent'&&!d.code.startsWith('BATCH|'));
  const byCat={};L.forEach(d=>{const ord=ordH(d);linesOf(ord).forEach(x=>{const nm=itemOfD(ord,x.id),p=resolvePrice(x.id,nm.n)||resolvePrice(x.id,nm.u);if(p)byCat[p.category]=(byCat[p.category]||0)+x.iss*p.cost})});
  const tot=Object.values(byCat).reduce((a,b)=>a+b,0)||1;
  const COL={'منتجات جافة':'#0b5c7a','حليب وأجبان':'#1d7a4f','مشروبات':'#b4531a','منظفات':'#5d6b78','مستلزمات':'#a479e2','أخرى':'#cfd7de'};
  let acc=0,grad=[];Object.entries(byCat).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{const p0=acc/tot*360;acc+=v;const p1=acc/tot*360;grad.push(`${COL[c]||'#999'} ${p0}deg ${p1}deg`)});
  const legend=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="bar"><span>${c}</span><i style="width:${Math.round(v/tot*60)}%;min-width:3px;background:${COL[c]||'#999'}"></i><em>${money(v)} (${Math.round(v/tot*100)}%)</em></div>`).join('')||'<p>لا توجد بيانات</p>';
  body=`<div class="row"><div style="width:180px;height:180px;border-radius:50%;background:conic-gradient(${grad.join(',')||'#eee 0 360deg'})"></div><div style="flex:1;min-width:200px">${legend}</div></div><p style="color:var(--mut)">كل الطلبات المُرسلة، بأسعار اليوم الحالية.</p>`;
 }
 $('#c').innerHTML=nav+body;
 if(CTAB==='list')drawPList();
}
function drawPList(){
 const q=($('#pq').value||'').trim().toLowerCase();
 $('#pb').innerHTML=PRICES.filter(p=>!q||(p.name+' '+(p.code||'')).toLowerCase().includes(q)).map(p=>`<tr${p.archived?' style="opacity:.5"':''}><td dir="ltr">${esc(p.code||'')}</td><td><input type="text" value="${esc(p.name)}" data-pn="${p.id}" style="width:100%"></td><td><input type="text" value="${esc(p.unit)}" data-pu="${p.id}" style="width:70px"></td><td><input type="number" step="0.0001" value="${p.cost}" data-pc="${p.id}" style="width:90px">${p.estimated?' <span title="سعر تقديري غير مؤكد / Estimated, unconfirmed" style="color:var(--warn)">≈</span>':''}</td><td><select data-pcat="${p.id}">${CATS.map(c=>`<option ${c===p.category?'selected':''}>${c}</option>`).join('')}</select></td><td><input type="checkbox" data-parch="${p.id}" ${p.archived?'checked':''}></td><td><button class="btn" data-psave="${p.id}">حفظ</button></td></tr>`).join('')||'<tr><td colspan="7">لا توجد نتائج</td></tr>';
}
$('#c').onclick=async e=>{
 const b=e.target.closest('[data-ct]');if(b){CTAB=b.dataset.ct;return drawC()}
 const acc=e.target.closest('[data-acc]');if(acc){const [iid,pid]=acc.dataset.acc.split('|').map(Number);await saveLink(iid,pid,'manual');LINKS=await api('item_price_link?select=*&limit=2000');return drawC()}
 const none=e.target.closest('[data-none]');if(none){await saveLink(+none.dataset.none,null,'none');LINKS=await api('item_price_link?select=*&limit=2000');return drawC()}
 const pick=e.target.closest('[data-pick]');if(pick){
  const it=ITEMS.find(x=>x.id===+pick.dataset.pick),term=prompt('ابحث عن اسم السعر المطابق لـ «'+it.ar+'»:','');if(term===null)return;
  const m=PRICES.filter(p=>!p.archived&&(p.name.toLowerCase().includes(term.toLowerCase())));
  if(!m.length)return alert('لا توجد نتائج');
  const choice=m.length===1?m[0]:m[+prompt(m.map((x,i)=>i+': '+x.name+' — '+money(x.cost)+'/'+x.unit).join('\n')+'\n\nاكتب رقم الاختيار:','0')||0];
  if(!choice)return;await saveLink(it.id,choice.id,'manual');LINKS=await api('item_price_link?select=*&limit=2000');return drawC()
 }
 const sv=e.target.closest('[data-psave]');if(sv){const id=+sv.dataset.psave;
  const newCost=+document.querySelector(`[data-pc="${id}"]`).value||0,old=PRICES.find(x=>x.id===id);
  const body={name:document.querySelector(`[data-pn="${id}"]`).value.trim(),unit:document.querySelector(`[data-pu="${id}"]`).value.trim(),cost:newCost,category:document.querySelector(`[data-pcat="${id}"]`).value,archived:document.querySelector(`[data-parch="${id}"]`).checked,estimated:old&&old.estimated&&newCost===old.cost};
  await api('prices?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});sv.textContent='تم ✓';PRICES=await api('prices?select=*&order=id.asc&limit=2000');return}
 if(e.target.id==='cAuto'){e.target.disabled=true;e.target.textContent='جارٍ المطابقة…';const n=await autoMatch();e.target.disabled=false;drawC();alert('تمت مطابقة '+n+' صنف تلقائياً (بالكود أو بالاسم المطابق تماماً)')}
 if(e.target.id==='pEst'){
  e.target.disabled=true;e.target.textContent='جارٍ التخمين…';
  const targets=PRICES.filter(p=>!p.archived&&p.cost<=0),base=PRICES.filter(p=>!p.archived&&!p.estimated&&p.cost>0);
  const writes=[];
  targets.forEach(t=>{
   const sameCat=base.filter(p=>p.category===t.category);
   const pool=sameCat.length?sameCat:base;
   const f=fuzzyBest(t.name,pool);
   if(f)writes.push({id:t.id,cost:Math.round(f.price.cost*1.5*100)/100,source:f.price.name});
  });
  for(const w of writes)await api('prices?id=eq.'+w.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({cost:w.cost,estimated:true})});
  PRICES=await api('prices?select=*&order=id.asc&limit=2000');e.target.disabled=false;e.target.textContent='تخمين الأسعار الناقصة (+50%)';drawPList();
  alert('تم تخمين '+writes.length+' صنف من أصل '+targets.length+' (الباقي ما له صنف مشابه كافٍ بالمطابقة).');
 }
};
$('#c').oninput=e=>{if(e.target.id==='pq')drawPList()};
function drawK(){
 if(!HOTELS.length){$('#k').innerHTML='<p style="color:#b4231a">جدول الفنادق غير موجود. نفّذ ملف 7-hotels.sql في Supabase (SQL Editor) ثم حدّث الصفحة.</p>';return}
 const base=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,''),t=fmtD(new Date());
 $('#k').innerHTML=HOTELS.map(h=>{
  const left=Math.round((new Date(h.expires_at+'T12:00:00')-new Date(t+'T12:00:00'))/864e5),col=left<0?'#b4231a':left<8?'#b4531a':'#1d7a4f';
  const L=[['رابط المشرف',base+'?h='+h.key],['رابط الأقسام (طلب فقط)',base+'?h='+h.key+'&m=order'],['رابط العامل',base+'?h='+h.key+'&m=worker']];
  return `<div style="border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px">
  <div class="row"><b style="font-size:17px;flex:1">${esc(h.name)} <small dir="ltr">(${esc(h.code)})</small></b><span class="tag ${h.active?'t-ok':'t-bad'}">${h.active?'فعّال':'موقوف'}</span><button class="btn alt" data-htog="${esc(h.code)}">${h.active?'إيقاف':'تفعيل'}</button></div>
  <div class="row"><span>الصلاحية حتى <b>${h.expires_at}</b> — <b style="color:${col}">${Math.abs(left)} ${left<0?'يوم منذ الانتهاء':'يوم متبقي'}</b></span></div>
  <div class="row"><button class="btn" data-hadd="${esc(h.code)}|7">+7</button><button class="btn" data-hadd="${esc(h.code)}|30">+30</button><button class="btn" data-hadd="${esc(h.code)}|90">+90</button><button class="btn" data-hadd="${esc(h.code)}|365">+سنة</button><input type="date" data-hd="${esc(h.code)}" value="${h.expires_at}"><button class="btn alt" data-hset="${esc(h.code)}">تحديد التاريخ</button></div>
  ${L.map(([n,u])=>`<div class="row"><b style="min-width:150px">${n}</b><input type="text" readonly value="${esc(u)}" style="flex:1;direction:ltr"><button class="btn alt" data-c="${esc(u)}">نسخ</button></div>`).join('')}
  <div class="row"><button class="btn bad" data-hrot="${esc(h.code)}">تغيير المفتاح السري</button></div></div>`}).join('')+
 `<h3>فندق جديد</h3><div class="row"><input type="text" id="hc" placeholder="الكود (مثل H2)" style="width:130px;direction:ltr"><input type="text" id="hn" placeholder="اسم الفندق" style="flex:1"><button class="btn" id="hnew">إضافة فندق</button></div><p>الفندق الجديد يبدأ بصلاحية 30 يوماً، ويرى الأصناف المشتركة فقط حتى تخصص له أصنافاً من تبويب الأصناف.</p>`;
}
async function patchHotel(code,body){await api('hotels?code=eq.'+enc(code),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});await load()}
$('#k').onclick=async e=>{
 const b=e.target.closest('button');if(!b)return;
 try{
  const t=fmtD(new Date());
  if(b.dataset.c){await navigator.clipboard.writeText(b.dataset.c);b.textContent='تم ✓';return setTimeout(()=>b.textContent='نسخ',1200)}
  if(b.dataset.hadd){const [c,n]=b.dataset.hadd.split('|'),h=HOTELS.find(x=>x.code===c),bs=h.expires_at>t?h.expires_at:t,d=new Date(bs+'T12:00:00');d.setDate(d.getDate()+ +n);return patchHotel(c,{expires_at:fmtD(d)})}
  if(b.dataset.hset){const v=document.querySelector(`[data-hd="${b.dataset.hset}"]`).value;if(/^\d{4}-\d\d-\d\d$/.test(v))return patchHotel(b.dataset.hset,{expires_at:v})}
  if(b.dataset.htog){const h=HOTELS.find(x=>x.code===b.dataset.htog);if(h.active&&!confirm('إيقاف الفندق؟ كل أجهزته تتوقف.'))return;return patchHotel(h.code,{active:!h.active})}
  if(b.dataset.hrot){if(!confirm('المفتاح القديم يتوقف فوراً، وكل أجهزة هذا الفندق تحتاج الرابط الجديد. متابعة؟'))return;return patchHotel(b.dataset.hrot,{key:rk()})}
  if(b.id==='hnew'){const c=$('#hc').value.trim().toUpperCase(),n=$('#hn').value.trim();
   if(!/^[A-Z0-9_-]{2,12}$/.test(c)||!n)return alert('اكتب كوداً (حروف وأرقام 2 إلى 12) واسم الفندق');
   const d=new Date();d.setDate(d.getDate()+30);
   await api('hotels',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({code:c,name:n,key:rk(),expires_at:fmtD(d)})});await load()}
 }catch(err){alert('تعذّر التنفيذ: '+err.message)}
};
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').hidden=true};
document.querySelector('#credit').textContent=CREDIT;
if(S)start();
</script>
