<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf0;--card:#fff;--ink:#16222c;--mut:#5d6b78;--ac:#0b5c7a;--ok:#1d7a4f;--warn:#b4531a;--bad:#b4231a;--ln:#cfd7de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Tajawal,Tahoma,Arial,sans-serif}
header{background:var(--ac);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:19px;flex:1}
nav{display:flex;gap:6px;padding:10px 12px 0;max-width:1000px;margin:auto;overflow-x:auto}
nav button{flex:1;white-space:nowrap;padding:9px 12px;border:0;border-radius:8px 8px 0 0;background:#d3dbe1;font:inherit;font-weight:700;color:var(--mut)}
nav button.on{background:var(--card);color:var(--ac)}
main{max-width:1000px;margin:auto;background:var(--card);padding:14px;min-height:70vh}
input,button,select{font:inherit}
input[type=text],input[type=email],input[type=password],input[type=search],select{padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--ink)}
.btn{padding:7px 12px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
.btn.alt{background:#fff;color:var(--ac);border:1px solid var(--ac)}
.btn.bad{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#f3f6f8;border-radius:10px;padding:12px;text-align:center}
.kpi b{display:block;font-size:26px;color:var(--ac)}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--ln);padding:6px 8px;text-align:right;vertical-align:middle}
th{background:#eef2f5}
.wrap{overflow-x:auto}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}
.bar span{min-width:130px;font-size:13px}
.bar i{display:block;height:14px;background:var(--ac);border-radius:4px}
.bar em{font-style:normal;font-size:13px;color:var(--mut)}
h3{margin:18px 0 6px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700}
.t-bad{background:#fbe3e0;color:var(--bad)}.t-ok{background:#dff3e8;color:var(--ok)}.t-w{background:#fff0dc;color:var(--warn)}
#login{max-width:340px;margin:60px auto;background:#fff;padding:22px;border-radius:12px}
#login input{width:100%;margin-bottom:10px}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px}
#modal>div{background:#fff;border-radius:12px;padding:16px;max-width:640px;width:100%;max-height:85vh;overflow:auto}
[hidden]{display:none!important}
#msg{color:var(--bad);min-height:1.5em}
</style>
</head>
<body>
<div id="login">
 <h2 style="margin-top:0">لوحة التحكم</h2>
 <input type="email" id="em" placeholder="البريد الإلكتروني" autocomplete="username">
 <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password">
 <button class="btn" id="go" style="width:100%">دخول</button>
 <p id="msg"></p>
</div>
<div id="app" hidden>
 <header><h1>لوحة التحكم — منظومة الصرف</h1><button class="btn alt" id="rf">تحديث</button><button class="btn alt" id="lo">خروج</button></header>
 <nav><button data-t="s" class="on">الملخص</button><button data-t="o">الطلبات</button><button data-t="i">الأصناف</button><button data-t="l">الروابط</button><button data-t="d">الإرسال</button><button data-t="k">الصلاحية</button></nav>
 <main>
  <section id="s"></section>
  <section id="o" hidden></section>
  <section id="i" hidden></section>
  <section id="l" hidden></section>
  <section id="d" hidden></section>
  <section id="k" hidden></section>
 </main>
</div>
<div id="modal" hidden><div id="mb"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const SB='https://xthhojjcblknukwgksxw.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0aGhvampjYmxrbnVrd2drc3h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MzA3NTEsImV4cCI6MjEwMDEwNjc1MX0.CDE76L1A6szBp9kYlZD3O1FtBl4CFuAseaRlEjk_Z98';
let S=null,NM={},BASE=[],SH={},O=[],ITEMS=[],LICROW=null,DEL=[],REC=[],DELERR=false,GHTOK=null;
const XL='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const fmtD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
try{S=JSON.parse(sessionStorage.getItem('s')||'null')}catch(e){}
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=ds=>'20'+ds.slice(0,2)+'-'+ds.slice(2,4)+'-'+ds.slice(4);
const ERR={'Invalid login credentials':'البريد أو كلمة المرور غير صحيحة','Email not confirmed':'البريد غير مفعّل — فعّله من Supabase (Authentication ثم Users)','Email logins are disabled':'تسجيل الدخول بالبريد معطّل في إعدادات Supabase'};
async function auth(body,gt){
 let r;
 try{r=await fetch(SB+'/auth/v1/token?grant_type='+gt,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})}
 catch(e){throw new Error('تعذّر الاتصال بالخادم، قد تكون الشبكة تحجب Supabase ('+e.message+')')}
 if(!r.ok){let j={};try{j=await r.json()}catch(e){}const m=j.error_description||j.msg||j.message||('HTTP '+r.status);throw new Error(ERR[m]||m)}
 const j=await r.json();S={a:j.access_token,r:j.refresh_token};
 try{sessionStorage.setItem('s',JSON.stringify(S))}catch(e){}
}
async function api(path,opt={},retry=true){
 const r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+(S&&S.a),'Content-Type':'application/json',...(opt.headers||{})}});
 if(r.status===401&&retry&&S&&S.r){try{await auth({refresh_token:S.r},'refresh_token');return api(path,opt,false)}catch(e){logout('انتهت الجلسة، سجّل الدخول من جديد');throw e}}
 if(!r.ok)throw new Error(await r.text());
 return r.status===204?null:r.json();
}
function logout(m){S=null;try{sessionStorage.removeItem('s')}catch(e){}$('#app').hidden=true;$('#login').hidden=false;$('#msg').textContent=m||''}
$('#go').onclick=async()=>{
 const b=$('#go');$('#msg').textContent='';b.disabled=true;b.textContent='جاري الدخول…';
 try{await auth({email:$('#em').value.trim(),password:$('#pw').value},'password');$('#pw').value='';await start()}
 catch(e){$('#msg').textContent=e.message||'فشل الدخول'}
 finally{b.disabled=false;b.textContent='دخول'}
};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#lo').onclick=()=>logout();$('#rf').onclick=()=>load();
document.querySelector('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
 document.querySelectorAll('nav button').forEach(b=>b.className=b.dataset.t===t?'on':'');
 ['s','o','i','l','d','k'].forEach(i=>$('#'+i).hidden=i!==t)};

function parse(r){
 const f=r.code.split('|'),fin=f[0]==='EBR1F';
 const it=(f[6]||'').split(',').filter(Boolean).map(x=>{const a=x.split(':');return fin?{id:+a[0],req:+a[1],iss:+a[2]}:{id:+a[0],req:+a[1]}});
 ((fin?f[9]:f[8])||'').split(';').filter(Boolean).forEach(t=>{const [id,n,u]=t.split('~');NM[id]={n,u:u||''}});
 return{fin,dept:f[1],no:f[2],ds:f[3],dn:f[7]||f[1],wk:fin?f[8]:'',it,at:r.created_at,dev:r.device};
}
function build(rows){
 const m={};
 rows.slice().sort((a,b)=>a.created_at<b.created_at?-1:1).forEach(r=>{
  const p=parse(r),k=p.dept+'|'+p.no+'|'+p.ds;
  const o=m[k]||(m[k]={k,dept:p.dept,no:p.no,ds:p.ds,dn:p.dn,req:{},fin:null,at:p.at,dev:p.dev});
  o.at=p.at;
  if(p.fin)o.fin={it:p.it,wk:p.wk||p.dev};else{p.it.forEach(x=>o.req[x.id]=x.req);o.dev=p.dev}
 });
 return Object.values(m).sort((a,b)=>a.at<b.at?1:-1);
}
const nm=id=>NM[id]||SH[id]||(BASE[id-1]?{n:BASE[id-1][0],u:BASE[id-1][1]||''}:{n:'صنف #'+id,u:''});
const lines=o=>o.fin?o.fin.it:Object.keys(o.req).map(id=>({id:+id,req:o.req[id]}));

async function load(){
 try{
  const [orders,items]=await Promise.all([api('orders?select=*&order=created_at.desc&limit=3000'),api('items?select=*&order=id.asc&limit=2000')]);
  ITEMS=items;SH={};items.forEach(x=>SH[x.id]={n:x.ar,u:x.en});
  O=build(orders);
  LICROW=await api('license?select=*&id=eq.1').then(r=>r[0]||null).catch(()=>null);
  GHTOK=await api('app_secrets?select=value&key=eq.gh_dispatch').then(r=>r[0]&&r[0].value||null).catch(()=>null);
  DELERR=false;try{[DEL,REC]=await Promise.all([api('deliveries?select=*&order=updated_at.desc&limit=500'),api('recipients?select=*&order=id.asc')])}catch(e){DEL=[];REC=[];DELERR=true}
 }catch(e){$('#s').innerHTML='<p style="color:#b4231a">تعذّر تحميل البيانات: '+esc(e.message)+'</p>'}
 drawS();drawO();drawI();drawL();drawD();drawK();
}
async function start(){
 $('#login').hidden=true;$('#app').hidden=false;
 try{const t=await (await fetch('index.html')).text();const m=t.match(/const DEF=`([^`]*)`/);if(m)BASE=m[1].split('\n').filter(Boolean).map(l=>l.split('|'))}catch(e){}
 load();
}
const bars=(arr,col)=>{const mx=Math.max(1,...arr.map(a=>a[1]));return arr.map(a=>`<div class="bar"><span>${esc(a[0])}</span><i style="width:${Math.round(a[1]*100/mx)}%;max-width:60%;min-width:3px${col?';background:'+col:''}"></i><em>${a[1]}</em></div>`).join('')||'<p>لا توجد بيانات</p>'};
const topN=(m,n)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);

function drawS(){
 const fin=O.filter(o=>o.fin),pend=O.length-fin.length;
 const unsent=DEL.filter(x=>['pending','approved','sending','failed'].includes(x.status)).length,stale=O.filter(o=>!o.fin&&(Date.now()-new Date(o.at))>864e5).length;
 let rq=0,dv=0;const na={},rqd={},dep={},day={};
 O.forEach(o=>{dep[o.dn]=(dep[o.dn]||0)+1;day[o.ds]=(day[o.ds]||0)+1;lines(o).forEach(x=>{rqd[x.id]=(rqd[x.id]||0)+1})});
 fin.forEach(o=>o.fin.it.forEach(x=>{rq+=x.req;dv+=Math.min(x.req,Math.max(0,x.iss));if(x.iss<=0)na[x.id]=(na[x.id]||0)+1}));
 const days=Object.keys(day).sort().slice(-14).map(d=>[dt(d).slice(5),day[d]]);
 $('#s').innerHTML=`<div class="grid"><div class="kpi"><b>${O.length}</b>إجمالي الطلبات</div><div class="kpi"><b>${fin.length}</b>تم الصرف</div><div class="kpi"><b>${pend}</b>بانتظار الصرف</div><div class="kpi"><b>${rq?Math.round(dv*100/rq):0}%</b>نسبة التلبية</div><div class="kpi"><b>${ITEMS.length}</b>أصناف مشتركة</div><div class="kpi"><b style="color:${unsent?'#b4231a':'#1d7a4f'}">${unsent}</b>نتائج لم تُرسل</div><div class="kpi"><b style="color:${stale?'#b4531a':'#1d7a4f'}">${stale}</b>بدون كود نهائي +24س</div></div>
 <h3>الطلبات حسب القسم</h3>${bars(topN(dep,10))}
 <h3>آخر 14 يوم</h3>${bars(days)}
 <h3>الأكثر طلباً</h3>${bars(topN(rqd,10).map(([id,c])=>[nm(id).n,c]))}
 <h3>الأكثر عدم توفراً</h3>${bars(topN(na,10).map(([id,c])=>[nm(id).n,c]),'#b4231a')}`;
}
function drawO(){
 $('#o').innerHTML=`<div class="row"><input type="search" id="oq" placeholder="ابحث برقم الطلب أو القسم" style="flex:1"></div><div class="wrap"><table><tr><th>الرقم</th><th>القسم</th><th>التاريخ</th><th>الحالة</th><th>الأصناف</th><th>الجهاز</th><th></th></tr><tbody id="ob"></tbody></table></div>`;
 const f=()=>{const q=$('#oq').value.trim().toLowerCase();
  $('#ob').innerHTML=O.filter(o=>!q||(o.no+' '+o.dn).toLowerCase().includes(q)).map(o=>`<tr><td><b>${esc(o.no)}</b></td><td>${esc(o.dn)}</td><td>${dt(o.ds)}</td><td><span class="tag ${o.fin?'t-ok':'t-w'}">${o.fin?'تم الصرف':'بانتظار الصرف'}</span></td><td>${lines(o).length}</td><td>${esc(o.fin?o.fin.wk:o.dev)}</td><td><button class="btn alt" data-v="${esc(o.k)}">تفاصيل</button> <button class="btn bad" data-d="${esc(o.k)}">حذف</button></td></tr>`).join('')||'<tr><td colspan="7">لا توجد طلبات</td></tr>'};
 $('#oq').oninput=f;f();
}
$('#o').onclick=async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.v){const o=O.find(x=>x.k===b.dataset.v);
  const rows=lines(o).map(x=>{const n=nm(x.id),st=o.fin?(x.iss<=0?'غير متوفر':x.iss<x.req?'جزئي':'تم'):'—';return `<tr><td>${esc(n.n)}<br><small dir="ltr">${esc(n.u)}</small></td><td>${x.req}</td><td>${o.fin?Math.max(0,x.iss):'—'}</td><td>${st}</td></tr>`}).join('');
  $('#mb').innerHTML=`<h3 style="margin-top:0">طلب ${esc(o.no)} — ${esc(o.dn)} — ${dt(o.ds)}</h3><table><tr><th>الصنف</th><th>المطلوب</th><th>المصروف</th><th>الحالة</th></tr>${rows}</table><p><button class="btn" onclick="$('#modal').hidden=true">إغلاق</button></p>`;$('#modal').hidden=false}
 if(b.dataset.d){const o=O.find(x=>x.k===b.dataset.d);
  if(!confirm('حذف الطلب '+o.no+' من لوحة التحكم؟ (لا يحذف نسخ الأجهزة)'))return;
  try{await api('orders?dept=eq.'+encodeURIComponent(o.dept)+'&no=eq.'+encodeURIComponent(o.no),{method:'DELETE'});load()}catch(err){alert('تعذّر الحذف: '+err.message)}}
};
function drawI(){
 $('#i').innerHTML=`<p>أصناف القائمة الأساسية (1–${BASE.length||317}) مخزنة داخل ملف المنظومة، وهنا الأصناف المشتركة المضافة من الأجهزة.</p><div class="row"><input type="search" id="iq" placeholder="ابحث" style="flex:1"></div><div class="wrap"><table><tr><th>#</th><th>كود Odoo</th><th>عربي</th><th>English</th><th></th></tr><tbody id="ib"></tbody></table></div>`;
 const f=()=>{const q=$('#iq').value.trim().toLowerCase();
  $('#ib').innerHTML=ITEMS.filter(x=>!q||(x.ar+' '+x.en+' '+(x.code||'')).toLowerCase().includes(q)).map(x=>`<tr><td>${x.id}</td><td dir="ltr">${esc(x.code||'')}</td><td><input type="text" value="${esc(x.ar)}" data-a="${x.id}" style="width:100%"></td><td><input type="text" value="${esc(x.en)}" data-e="${x.id}" style="width:100%;direction:ltr"></td><td><button class="btn" data-s="${x.id}">حفظ</button> <button class="btn bad" data-x="${x.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد أصناف مشتركة</td></tr>'};
 $('#iq').oninput=f;f();
}
$('#i').onclick=async e=>{
 const b=e.target.closest('button');if(!b)return;
 try{
  if(b.dataset.s){const id=b.dataset.s;await api('items?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({ar:document.querySelector(`[data-a="${id}"]`).value.trim(),en:document.querySelector(`[data-e="${id}"]`).value.trim()})});b.textContent='تم ✓';setTimeout(load,600)}
  if(b.dataset.x){if(!confirm('حذف الصنف نهائياً؟ الأجهزة تختفي منها بعد التحديث.'))return;await api('items?id=eq.'+b.dataset.x,{method:'DELETE'});load()}
 }catch(err){alert('تعذّر التنفيذ: '+err.message)}
};
function drawL(){
 const base=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
 const L=[['رابط المشرف (أنت)',base],['رابط الأقسام (طلب فقط)',base+'?m=order'],['رابط العامل',base+'?m=worker'],['لوحة التحكم',base+'dashboard.html'],['مشروع Supabase','https://supabase.com/dashboard/project/xthhojjcblknukwgksxw'],['مستودع GitHub','https://github.com/githup29333/store-system']];
 $('#l').innerHTML=L.map(([t,u])=>`<div class="row"><b style="min-width:160px">${t}</b><input type="text" readonly value="${esc(u)}" style="flex:1;direction:ltr"><button class="btn alt" data-c="${esc(u)}">نسخ</button><a class="btn" href="${esc(u)}" target="_blank" rel="noopener" style="text-decoration:none">فتح</a></div>`).join('');
}
$('#l').onclick=e=>{const b=e.target.closest('[data-c]');if(b)navigator.clipboard.writeText(b.dataset.c).then(()=>{b.textContent='تم ✓';setTimeout(()=>b.textContent='نسخ',1200)})};

/* ---------- الإرسال ---------- */
function addSheet(wb,ord,name){
 const ws=wb.addWorksheet(name,{views:[{rightToLeft:true,state:'frozen',ySplit:5}],pageSetup:{paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,printTitlesRow:'5:5',margins:{left:.4,right:.4,top:.5,bottom:.5,header:.3,footer:.3}}});
 ws.columns=[{width:6},{width:38},{width:36},{width:12},{width:12},{width:16}];
 const th={style:'thin',color:{argb:'FF9AA7B2'}},BD={top:th,left:th,bottom:th,right:th},F='Tahoma';
 const put=(ref,v,o={})=>{const c=ws.getCell(ref);c.value=v;c.font={name:F,size:o.sz||11,bold:!!o.b,color:{argb:o.fc||'FF16222C'}};if(o.bg)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:o.bg}};c.alignment={horizontal:o.h||'center',vertical:'middle',wrapText:true};if(o.bd)c.border=BD;return c};
 ws.mergeCells('A1:F1');put('A1','Ebreaze Hotel',{sz:16,b:1,fc:'FFFFFFFF',bg:'FF0B5C7A'});ws.getRow(1).height=30;
 ws.mergeCells('A2:F2');put('A2','إذن صرف مخزني / Stores Issue Note',{sz:13,b:1,bg:'FFE4EEF3'});ws.getRow(2).height=24;
 ws.mergeCells('A3:B3');put('A3','القسم / Department: '+(ord.dn||ord.dept),{b:1,bd:1,h:'right'});
 put('C3','رقم الطلب / Order No.: '+ord.no,{b:1,bd:1});
 ws.mergeCells('D3:F3');put('D3','التاريخ / Date: '+dstrOf(ord),{b:1,bd:1});ws.getRow(3).height=24;
 ws.getRow(4).height=6;
 ['#','الصنف','Item','المطلوب\nRequested','المصروف\nIssued','ملاحظات\nRemarks'].forEach((t,i)=>put('ABCDEF'[i]+'5',t,{b:1,fc:'FFFFFFFF',bg:'FF0B5C7A',bd:1}));
 ws.getRow(5).height=34;
 const L=linesOf(ord);let r=6;
 L.forEach((x,i)=>{const c=itemOfD(ord,x.id),bg=i%2?'FFF4F8FA':null,sh=x.iss<x.req;
  put('A'+r,i+1,{bd:1,bg});put('B'+r,c.n,{bd:1,bg,h:'right'});put('C'+r,c.u,{bd:1,bg,h:'left'});
  put('D'+r,x.req,{bd:1,bg});put('E'+r,x.iss,{bd:1,bg,b:1});
  put('F'+r,sh?'ناقص / Short':'',{bd:1,bg,b:sh,fc:sh?'FFB4531A':null});r++});
 ws.mergeCells(`A${r}:F${r}`);put('A'+r,'إجمالي الأصناف المصروفة / Total issued items: '+L.length,{b:1,bg:'FFE4EEF3',bd:1});ws.getRow(r).height=22;r+=2;
 ws.mergeCells(`A${r}:C${r}`);put('A'+r,'مقدّم الطلب / Requested by\n\nالتوقيع / Signature: ____________',{bd:1,h:'right'});
 ws.mergeCells(`D${r}:F${r}`);put('D'+r,'أمين المخزن / Storekeeper\n\nالتوقيع / Signature: ____________',{bd:1,h:'right'});ws.getRow(r).height=62;r++;
 ws.mergeCells(`A${r}:F${r}`);put('A'+r,'الأصناف غير المصروفة محذوفة من هذا النموذج / Unissued items are not listed',{sz:9,fc:'FF5D6B78'});
 return ws;
}
const linesOf=ord=>Object.keys(ord.items).map(Number).sort((a,b)=>a-b).filter(id=>ord.items[id].on&&ord.items[id].iss>0).map(id=>({id,req:ord.items[id].req,iss:ord.items[id].iss}));
const dstrOf=ord=>'20'+ord.ds.slice(0,2)+'-'+ord.ds.slice(2,4)+'-'+ord.ds.slice(4);
const itemOfD=(ord,id)=>(ord.names&&ord.names[id])||nm(id);
function ordFromCode(code){
 const f=code.split('|'),names={},items={};
 (f[9]||'').split(';').filter(Boolean).forEach(t=>{const [id,n,u]=t.split('~');names[id]={n,u:u||''}});
 (f[6]||'').split(',').filter(Boolean).forEach(x=>{const [id,rq,is]=x.split(':');items[id]={req:+rq,iss:+is,on:+is>0}});
 return{dept:f[1],no:f[2],ds:f[3],dn:f[7]||f[1],names,items};
}
const ST={pending:['بانتظار موافقتك','t-w'],approved:['موافق — بانتظار الإرسال','t-w'],sending:['قيد الإرسال','t-w'],sent:['تم الإرسال ✓','t-ok'],failed:['فشل الإرسال','t-bad'],skipped:['تم تجاهله','']};
function drawD(){
 if(DELERR){$('#d').innerHTML='<p style="color:#b4231a">جداول الإرسال غير موجودة. نفّذ ملف delivery.sql في Supabase (SQL Editor) ثم حدّث الصفحة.</p>';return}
 const cnt=s=>DEL.filter(x=>x.status===s).length;
 const rec=REC.map(r=>`<tr><td><span class="tag ${r.kind==='to'?'t-ok':'t-w'}">${r.kind==='to'?'To':'CC'}</span></td><td>${esc(r.name||'')}</td><td dir="ltr">${esc(r.email)}</td><td><button class="btn bad" data-rd="${r.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="4">لا يوجد مستلمون</td></tr>';
 const rows=DEL.map(d=>{const [lb,cl]=ST[d.status]||[d.status,''],age=(Date.now()-new Date(d.updated_at))/36e5,late=['pending','approved','sending','failed'].includes(d.status)&&age>6;
  const act=['pending','failed'].includes(d.status)?`<button class="btn" data-ap="${esc(d.key)}">موافقة وإرسال</button> <button class="btn alt" data-sk="${esc(d.key)}">تجاهل</button>`:'';
  return `<tr><td><b>${esc(d.no)}</b>${d.rev>1?' <small>(تحديث '+d.rev+')</small>':''}</td><td>${esc(d.dn||d.dept)}</td><td>${dt(d.ds)}</td><td><span class="tag ${cl}">${lb}</span>${late?' <b style="color:#b4231a">متأخر</b>':''}${d.error?'<br><small style="color:#b4231a">'+esc(d.error)+'</small>':''}</td><td>${act}</td></tr>`}).join('')||'<tr><td colspan="5">لا توجد نتائج للإرسال بعد</td></tr>';
 $('#d').innerHTML=`<div class="grid"><div class="kpi"><b>${cnt('pending')}</b>بانتظار موافقتك</div><div class="kpi"><b>${cnt('approved')+cnt('sending')}</b>قيد الإرسال</div><div class="kpi"><b style="color:${cnt('failed')?'#b4231a':'inherit'}">${cnt('failed')}</b>فشل</div><div class="kpi"><b>${cnt('sent')}</b>تم الإرسال</div></div>
 <h3>نتائج الصرف</h3><div class="wrap"><table><tr><th>الطلب</th><th>القسم</th><th>التاريخ</th><th>الحالة</th><th></th></tr>${rows}</table></div>
 <h3>المستلمون</h3><div class="wrap"><table><tr><th>النوع</th><th>الاسم</th><th>البريد</th><th></th></tr>${rec}</table></div>
 <h3>الإرسال الفوري (GitHub)</h3>
 <p>${GHTOK?'<span class="tag t-ok">مفعّل</span> الضغط على "موافقة وإرسال" يشغّل الإرسال فوراً.':'<span class="tag t-bad">غير مفعّل</span> الإرسال يعتمد على الجدولة وقد يتأخر ساعات.'}</p>
 <div class="row"><input type="text" id="gtok" placeholder="الصق مفتاح GitHub هنا" style="flex:1;direction:ltr;-webkit-text-security:disc" autocomplete="off"><button class="btn" id="gsave">حفظ المفتاح</button>${GHTOK?'<button class="btn bad" id="gdel">حذف</button>':''}<button class="btn alt" id="gnow">تشغيل الإرسال الآن</button></div>
 <div class="row" style="margin-top:10px"><select id="rk"><option value="to">To</option><option value="cc">CC</option></select><input type="text" id="rn" placeholder="الاسم" style="flex:1"><input type="email" id="re" placeholder="البريد" style="flex:1;direction:ltr"><button class="btn" id="radd">إضافة</button></div>`;
}
async function ghRun(){
 if(!GHTOK)return 'no-token';
 try{const r=await fetch('https://api.github.com/repos/githup29333/store-system/actions/workflows/send.yml/dispatches',{method:'POST',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+GHTOK,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify({ref:'main',inputs:{mode:'send'}})});
  return r.status===204?'ok':'HTTP '+r.status}catch(e){return e.message}
}
async function ensureAuth(){try{await api('recipients?select=id&limit=1')}catch(e){}}
async function approve(key){
 const d=DEL.find(x=>x.key===key);if(!d)return;
 if(!REC.some(r=>r.active&&r.kind==='to'))return alert('أضف مستلماً من نوع To أولاً');
 try{
  await ensureAuth();
  const ord=ordFromCode(d.code),wb=new ExcelJS.Workbook();addSheet(wb,ord,'Issue');
  const buf=await wb.xlsx.writeBuffer(),path=d.key.replace(/[^A-Za-z0-9_-]/g,'_')+'_r'+d.rev+'.xlsx';
  const up=await fetch(SB+'/storage/v1/object/exports/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+S.a,'Content-Type':XL,'x-upsert':'true'},body:buf});
  if(!up.ok)throw new Error(await up.text());
  const now=new Date().toISOString();
  await api('deliveries?key=eq.'+encodeURIComponent(d.key)+'&rev=eq.'+d.rev,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'approved',file_path:path,approved_at:now,updated_at:now,error:null})});
  await load();
  const g=await ghRun();
  alert('تمت الموافقة. '+(g==='ok'?'تم تشغيل الإرسال الآن، يصل الإيميل خلال دقيقة أو دقيقتين.':g==='no-token'?'الإرسال الفوري غير مفعّل، فسيُرسل بالجدولة (قد يتأخر ساعات).':'تعذّر تشغيل الإرسال الفوري ('+g+')، سيُرسل بالجدولة.'));
 }catch(e){alert('تعذّرت الموافقة: '+e.message)}
}
$('#d').onclick=async e=>{
 const b=e.target.closest('button');if(!b)return;
 try{
  if(b.dataset.ap)return approve(b.dataset.ap);
  if(b.id==='gsave'){const v=$('#gtok').value.trim();if(!v)return;await api('app_secrets',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:'gh_dispatch',value:v,updated_at:new Date().toISOString()})});GHTOK=v;drawD();return alert('تم حفظ المفتاح')}
  if(b.id==='gdel'){await api('app_secrets?key=eq.gh_dispatch',{method:'DELETE'});GHTOK=null;drawD();return}
  if(b.id==='gnow'){const g=await ghRun();return alert(g==='ok'?'تم تشغيل الإرسال الآن':g==='no-token'?'أضف المفتاح أولاً':'تعذّر التشغيل ('+g+')')}
  if(b.dataset.sk){await api('deliveries?key=eq.'+encodeURIComponent(b.dataset.sk),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'skipped',updated_at:new Date().toISOString()})});return load()}
  if(b.dataset.rd){if(!confirm('حذف هذا المستلم؟'))return;await api('recipients?id=eq.'+b.dataset.rd,{method:'DELETE'});return load()}
  if(b.id==='radd'){const em=$('#re').value.trim();if(!/^\S+@\S+\.\S+$/.test(em))return alert('البريد غير صحيح');
   await api('recipients',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({kind:$('#rk').value,name:$('#rn').value.trim(),email:em})});load()}
 }catch(err){alert('تعذّر التنفيذ: '+err.message)}
};
function drawK(){
 const e=LICROW&&LICROW.expires_at;
 if(!e){$('#k').innerHTML='<p style="color:#b4231a">جدول الصلاحية غير موجود. نفّذ ملف license.sql في Supabase (SQL Editor) ثم حدّث الصفحة.</p>';return}
 const t=fmtD(new Date()),left=Math.round((new Date(e+'T12:00:00')-new Date(t+'T12:00:00'))/864e5);
 $('#k').innerHTML=`<div class="grid"><div class="kpi"><b>${e}</b>تاريخ الانتهاء</div><div class="kpi"><b style="color:${left<0?'#b4231a':left<8?'#b4531a':'#1d7a4f'}">${Math.abs(left)}</b>${left<0?'يوم منذ الانتهاء':'يوم متبقي'}</div></div>
 <p>التمديد يسري على <b>كل الأجهزة</b> عند فتح المنظومة أو الرجوع لها. وبدون إنترنت تعمل حسب آخر تاريخ حفظته.</p>
 <div class="row"><button class="btn" data-add="7">+7 أيام</button><button class="btn" data-add="30">+30 يوم</button><button class="btn" data-add="90">+90 يوم</button><button class="btn" data-add="365">+سنة</button></div>
 <div class="row"><input type="date" id="kd" value="${e}"><button class="btn alt" id="kset">تحديد التاريخ</button></div>`;
}
async function setExp(d){
 try{await api('license?id=eq.1',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({expires_at:d,updated_at:new Date().toISOString()})});await load();alert('تم. الصلاحية حتى '+d)}
 catch(e){alert('تعذّر التحديث: '+e.message)}
}
$('#k').onclick=e=>{const b=e.target.closest('button');if(!b||!LICROW)return;
 if(b.dataset.add){const t=fmtD(new Date()),base=LICROW.expires_at>t?LICROW.expires_at:t,d=new Date(base+'T12:00:00');d.setDate(d.getDate()+ +b.dataset.add);setExp(fmtD(d))}
 if(b.id==='kset'){const v=$('#kd').value;if(/^\d{4}-\d\d-\d\d$/.test(v))setExp(v)}
};
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').hidden=true};
if(S)start();
</script>
