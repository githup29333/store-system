<!doctype html>
<html lang="ar" dir="rtl"><head>
<script src="hotel-theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>سجل الاستلام</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#172431;--mut:#647383;--line:#dce4eb;--teal:#167c80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Tajawal,Arial,sans-serif;padding:14px}.wrap{max-width:1100px;margin:22px auto}.hero{background:linear-gradient(120deg,#101827,#1c3447 65%,#245b62);color:#fff;border-radius:18px;padding:18px 22px}.hero h1{margin:0}.hero p{margin:3px 0;color:#d5e0e8}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:13px;box-shadow:0 8px 25px #1723330b}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:130px}button,.btn{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:linear-gradient(120deg,#167c80,#216a78);color:white;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}.alt{background:white;color:#246a73;border:1px solid #cbdcde}input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;color:var(--ink);min-width:0}.muted{color:var(--mut);font-size:13px}.err{color:#b42318}.hidden{display:none!important}#login{max-width:420px;margin:9vh auto;text-align:center}#login input,#login button{width:100%;margin:5px 0}.tableWrap{overflow:auto;margin-top:12px}table{width:100%;min-width:700px;border-collapse:collapse;font-size:13px}td,th{text-align:right;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f4f7f9;color:#536579;position:sticky;top:0}.count{font-weight:800;color:var(--teal)}@media(max-width:600px){body{padding:8px}.wrap{margin:8px auto}.panel{padding:11px}.hero{padding:15px}}
html[data-theme=dark]{color-scheme:dark;--bg:#0b1220;--card:#121d2b;--ink:#e7edf5;--mut:#9aabbd;--line:#2a394c}html[data-theme=dark] body{background:var(--bg);color:var(--ink)}html[data-theme=dark] .panel{background:var(--card);border-color:var(--line)}html[data-theme=dark] input{background:#0e1826;color:var(--ink);border-color:#34465b}html[data-theme=dark] th{background:#1b2a3c;color:#bdcad8}
</style></head><body><div class="wrap">
<div id="login" class="panel"><div style="font-size:32px">📋</div><h2>سجل الاستلام</h2><p class="muted">سجّل الدخول بالحساب المصرح له في الفندق</p><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="loginBtn">دخول</button><div id="loginErr" class="err"></div></div>
<div id="app" class="hidden"><header class="hero"><div class="row"><div><h1>سجل الاستلام</h1><p>سجل مستقل لجميع حركات الاستلام المسجلة لهذا الفندق</p></div><button class="alt" id="logout">خروج</button></div></header>
<section class="panel"><div class="row"><b id="hotelLabel">الفندق</b><span class="count" id="count">0 عملية</span><button class="alt" id="refresh">تحديث</button><button id="export">تصدير CSV</button></div>
<div class="row" style="margin-top:10px"><input id="search" type="search" placeholder="ابحث باسم الصنف أو المرجع أو الملاحظة"><input id="from" type="date" aria-label="من تاريخ"><input id="to" type="date" aria-label="إلى تاريخ"></div><div id="status" class="muted" style="margin-top:8px">جارٍ التحميل…</div><div class="tableWrap" id="rows"></div></section></div></div>
<script>
if(window.applyHotelTheme)window.applyHotelTheme('EBR');
const SB='https://xthhojjcblknukwgksxw.supabase.co';const KEY=["eyJhbGciOiJIUzI1NiIsInR5cCI6","IkpXVCJ9.eyJpc3MiOiJzdXBhYmF","zZSIsInJlZiI6Inh0aGhvampjYmx","rbnVrd2drc3h3Iiwicm9sZSI6ImF","ub24iLCJpYXQiOjE3ODQ1MzA3NTE","sImV4cCI6MjEwMDEwNjc1MX0.CDE","76L1A6szBp9kYlZD3O1FtBl4CFuA","seaRlEjk_Z98"].join('');
let session=null,user=null,HOTEL='',allRows=[],items=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function auth(body,grant){const r=await fetch(SB+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error_description||j.msg||j.message||'تعذّر تسجيل الدخول');session={access:j.access_token,refresh:j.refresh_token};user=j.user}
async function api(path,opts={},retry=true){opts.headers={apikey:KEY,Authorization:'Bearer '+(session?.access||''),'Content-Type':'application/json',...(opts.headers||{})};const r=await fetch(SB+'/rest/v1/'+path,opts);if(r.status===401&&retry&&session?.refresh){await auth({refresh_token:session.refresh},'refresh_token');return api(path,opts,false)}const t=await r.text();if(!r.ok)throw Error(t.slice(0,260)||'HTTP '+r.status);return t?JSON.parse(t):null}
async function loadMyHotel(){const r=await fetch(SB+'/functions/v1/sbfenv',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access,'Content-Type':'application/json'},body:JSON.stringify({action:'my_status'})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.user)throw Error(j.error||'تعذّر التحقق من الحساب');if(!j.user.is_active||j.user.is_paralyzed)throw Error('الحساب موقوف');const p=j.user.permissions?.inventory||{};if(p.read!==true)throw Error('لا تملك صلاحية قراءة سجل الاستلام');HOTEL=String(j.user.hotel_code||'').toUpperCase();if(window.applyHotelTheme)window.applyHotelTheme(HOTEL);if(!HOTEL)throw Error('الحساب غير مرتبط بفندق')}
async function load(){try{$('#status').textContent='جارٍ تحميل سجل الفندق…';const [m,it]=await Promise.all([api('hotel_stock_movements?select=item_id,quantity,unit,created_at,created_by,reference,note,movement_type&hotel_code=eq.'+encodeURIComponent(HOTEL)+'&movement_type=eq.in&order=created_at.desc&limit=1000'),api('items?select=id,ar,en')]);allRows=m;items=it;render();$('#status').textContent=m.length===1000?'تم تحميل آخر 1000 عملية (يمكن تضييق البحث بالتاريخ).':'تم تحديث السجل';}catch(e){$('#status').textContent='تعذّر تحميل السجل: '+e.message;$('#status').className='err'}}
function filtered(){const q=$('#search').value.trim().toLowerCase(),from=$('#from').value,to=$('#to').value;return allRows.filter(x=>{const it=items.find(z=>z.id===x.item_id),d=new Date(x.created_at).toISOString().slice(0,10);return (!q||((it?.ar||'')+' '+(it?.en||'')+' '+(x.reference||'')+' '+(x.note||'')).toLowerCase().includes(q))&&(!from||d>=from)&&(!to||d<=to)})}
function render(){const rows=filtered();$('#count').textContent=rows.length+' عملية';$('#rows').innerHTML=rows.length?'<table><thead><tr><th>التاريخ والوقت</th><th>الصنف</th><th>الكمية</th><th>الوحدة</th><th>المرجع</th><th>الملاحظة</th></tr></thead><tbody>'+rows.map(x=>{const it=items.find(z=>z.id===x.item_id);return '<tr><td>'+new Date(x.created_at).toLocaleString('ar')+'</td><td>'+esc(it?.ar||('صنف '+x.item_id))+(it?.en?'<br><small>'+esc(it.en)+'</small>':'')+'</td><td>'+esc(x.quantity)+'</td><td>'+esc(x.unit||'—')+'</td><td>'+esc(x.reference||'—')+'</td><td>'+esc(x.note||'—')+'</td></tr>'}).join('')+'</tbody></table>':'<p class="muted">لا توجد عمليات مطابقة.</p>'}
$('#loginBtn').onclick=async()=>{const b=$('#loginBtn');b.disabled=true;$('#loginErr').textContent='';try{await auth({email:$('#email').value.trim(),password:$('#password').value},'password');await loadMyHotel();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#hotelLabel').textContent='سجل الفندق: '+HOTEL;await load()}catch(e){$('#loginErr').textContent=e.message}finally{b.disabled=false}};
$('#password').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};$('#refresh').onclick=load;['search','from','to'].forEach(id=>$('#'+id).addEventListener('input',render));
$('#export').onclick=()=>{const rows=filtered(),head=['Date','Item','Quantity','Unit','Reference','Note'],data=rows.map(x=>{const it=items.find(z=>z.id===x.item_id);return [new Date(x.created_at).toISOString(),it?.ar||x.item_id,x.quantity,x.unit||'',x.reference||'',x.note||'']});const csv='\ufeff'+[head,...data].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='receiving-log-'+HOTEL+'.csv';a.click();URL.revokeObjectURL(a.href)};
$('#logout').onclick=()=>{session=null;user=null;allRows=[];$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#password').value=''};
</script></body></html>
