<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>استلام المنتجات</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#172431;--mut:#647383;--line:#dce4eb;--teal:#167c80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Tajawal,Arial,sans-serif;padding:16px}.wrap{max-width:820px;margin:25px auto}.hero{background:linear-gradient(120deg,#101827,#1c3447 65%,#245b62);color:white;border-radius:19px;padding:20px 24px}.hero h1{margin:0}.hero p{margin:3px 0 0;color:#d5e0e8}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:14px;box-shadow:0 8px 25px #1723330b}input{font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;color:var(--ink);min-width:0}button{font:inherit;border:0;border-radius:10px;padding:10px 15px;background:linear-gradient(120deg,#167c80,#216a78);color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.alt{background:white;color:#246a73;border:1px solid #cbdcde}.danger{background:#fff5f4;color:#a33;border:1px solid #f0ceca}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.hidden{display:none!important}.muted{color:var(--mut);font-size:13px}.err{color:#b42318}.success{color:#16744c}#login{max-width:420px;margin:9vh auto;text-align:center}#login input,#login button{width:100%;margin:5px 0}.results{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:11px;margin-top:10px}.pick{display:block;width:100%;text-align:right;border-radius:0;background:white;color:var(--ink);border-bottom:1px solid #edf0f3}.item{display:grid;grid-template-columns:minmax(0,1fr) 125px 42px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f3}.item small{display:block;color:var(--mut)}#search{width:100%;margin-top:10px}.history{overflow:auto;font-size:13px}table{width:100%;min-width:460px;border-collapse:collapse}td,th{text-align:right;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--mut)}@media(max-width:560px){body{padding:9px}.wrap{margin:8px auto}.panel{padding:12px}.item{grid-template-columns:minmax(0,1fr) 90px 38px}}
</style></head><body><div class="wrap">
<div id="login" class="panel"><div style="font-size:34px">📦</div><h2>بوابة استلام المنتجات</h2><p class="muted">سجّل الدخول بحساب العامل المخصص للاستلام</p><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="loginBtn">دخول</button><div id="loginErr" class="err"></div></div>
<div id="app" class="hidden"><header class="hero"><div class="row"><div><h1>استلام المنتجات</h1><p>اختر الأصناف وسجّل الكميات المستلمة</p></div><button class="alt" id="logout">خروج</button></div></header>
<section class="panel"><div class="row"><b>إضافة أصناف للاستلام</b><span class="muted" id="hotelLabel"></span></div><input id="search" type="search" placeholder="ابحث باسم الصنف…"><div id="results" class="results"></div><div style="margin-top:14px"><b>الأصناف المحددة</b><div id="selected" class="muted">لم يتم اختيار أصناف بعد</div></div><div class="row" style="margin-top:14px"><button id="save">حفظ الاستلام وتحديث المخزون</button><button id="clear" class="alt">تفريغ</button></div><div id="msg" class="muted" style="margin-top:9px"></div></section>
<section class="panel"><div class="row"><b>آخر عمليات الاستلام</b><button id="refresh" class="alt">تحديث</button></div><div id="history" class="history muted" style="margin-top:10px">جارٍ التحميل…</div></section></div></div>
<script>
const SB='https://xthhojjcblknukwgksxw.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0aG9qampjYmxrbnVrd2drc3h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MzA3NTEsImV4cCI6MjEwMDEwNjc1MX0.CDE76L1A6szBp9kYlZD3O1FtBl4CFuAseaRlEjk_Z98';
const HOTEL=(new URLSearchParams(location.search).get('h')||'EBR').toUpperCase(),$=s=>document.querySelector(s);let session=null,user=null,items=[],stock=[],selected=new Map(),busy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(t,k='muted'){$('#msg').className=k;$('#msg').textContent=t}
async function auth(body,grant){const r=await fetch(SB+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error_description||j.msg||j.message||'تعذّر تسجيل الدخول');session={access:j.access_token,refresh:j.refresh_token};user=j.user}
async function api(path,opts={},retry=true){opts.headers={apikey:KEY,Authorization:'Bearer '+(session?.access||''),'Content-Type':'application/json',...(opts.headers||{})};const r=await fetch(SB+'/rest/v1/'+path,opts);if(r.status===401&&retry&&session?.refresh){await auth({refresh_token:session.refresh},'refresh_token');return api(path,opts,false)}const t=await r.text();if(!r.ok)throw Error(t.slice(0,260)||'HTTP '+r.status);return t?JSON.parse(t):null}
function visibleItems(){return items.filter(x=>!Array.isArray(x.hotels)||!x.hotels.length||x.hotels.includes(HOTEL))}
async function loadData(){try{const [a,b]=await Promise.all([api('items?select=id,ar,en,hotels&order=ar.asc'),api('hotel_inventory?select=item_id,quantity,unit&hotel_code=eq.'+encodeURIComponent(HOTEL))]);items=a;stock=b;renderResults();await loadHistory()}catch(e){say('تعذّر تحميل الأصناف أو الرصيد: '+e.message,'err')}}
async function loadHistory(){const rows=await api('hotel_stock_movements?select=item_id,quantity,unit,created_at&hotel_code=eq.'+encodeURIComponent(HOTEL)+'&movement_type=eq.in&order=created_at.desc&limit=35'),names=new Map(items.map(x=>[x.id,x.ar]));$('#history').innerHTML=rows.length?'<table><tr><th>الصنف</th><th>الكمية</th><th>التاريخ</th></tr>'+rows.map(x=>'<tr><td>'+esc(names.get(x.item_id)||('صنف '+x.item_id))+'</td><td>'+esc(x.quantity)+' '+esc(x.unit)+'</td><td>'+new Date(x.created_at).toLocaleString('ar')+'</td></tr>').join('')+'</table>':'لا توجد عمليات استلام سابقة'}
function renderResults(){const q=$('#search').value.trim().toLowerCase(),list=visibleItems().filter(x=>!q||(x.ar+' '+(x.en||'')).toLowerCase().includes(q)).slice(0,80);$('#results').innerHTML=list.map(x=>'<button class="pick" data-pick="'+x.id+'">'+esc(x.ar)+(x.en?' <small>— '+esc(x.en)+'</small>':'')+'</button>').join('')||'<div class="muted" style="padding:12px">لا توجد أصناف مطابقة</div>'}
function renderSelected(){$('#selected').innerHTML=selected.size?[...selected].map(([id,v])=>{const it=items.find(x=>x.id===id),s=stock.find(x=>x.item_id===id);return '<div class="item"><div><b>'+esc(it?.ar||'')+'</b><small>'+(esc(s?.unit||'قطعة'))+' · الرصيد الحالي: '+esc(s?.quantity??0)+'</small></div><input type="number" min="0.001" step="0.001" value="'+esc(v)+'" data-qty="'+id+'" placeholder="الكمية"><button class="danger" data-remove="'+id+'">×</button></div>'}).join(''):'لم يتم اختيار أصناف بعد'}
$('#results').onclick=e=>{const b=e.target.closest('[data-pick]');if(!b)return;const id=+b.dataset.pick;if(!selected.has(id))selected.set(id,'');renderSelected()};
$('#selected').oninput=e=>{const id=+e.target.dataset.qty;if(id)selected.set(id,e.target.value)};
$('#selected').onclick=e=>{const b=e.target.closest('[data-remove]');if(b){selected.delete(+b.dataset.remove);renderSelected()}};
$('#search').oninput=renderResults;
$('#loginBtn').onclick=async()=>{const b=$('#loginBtn');b.disabled=true;$('#loginErr').textContent='';try{await auth({email:$('#email').value.trim(),password:$('#password').value},'password');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#hotelLabel').textContent='الفندق: '+HOTEL;await loadData()}catch(e){$('#loginErr').textContent=e.message}finally{b.disabled=false}};
$('#password').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};
$('#save').onclick=async()=>{if(busy)return;const entries=[...selected];if(!entries.length)return say('اختر صنفًا واحدًا على الأقل','err');const payload=[],ref='REC-'+Date.now();for(const [id,v] of entries){const q=Number(v);if(!Number.isFinite(q)||q<=0)return say('أدخل كمية صحيحة لكل صنف','err');const s=stock.find(x=>x.item_id===id);payload.push({hotel_code:HOTEL,item_id:id,movement_type:'in',quantity:q,unit:s?.unit||'قطعة',note:'استلام منتجات',reference:ref,created_by:user.id})}busy=true;$('#save').disabled=true;$('#save').textContent='جارٍ الحفظ…';say('جارٍ تسجيل الكميات…');try{await api('hotel_stock_movements',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});selected.clear();renderSelected();say('تم الاستلام وتحديث المخزون بنجاح ✓','success');await loadData()}catch(e){say('تعذّر الحفظ: '+e.message,'err')}finally{busy=false;$('#save').disabled=false;$('#save').textContent='حفظ الاستلام وتحديث المخزون'}};
$('#clear').onclick=()=>{selected.clear();renderSelected();say('تم تفريغ الأصناف')};$('#refresh').onclick=loadData;
$('#logout').onclick=()=>{session=null;user=null;$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#password').value=''};
</script></body></html>
